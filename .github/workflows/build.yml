name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios:
    name: iOS / macOS build + test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Check toolchain
        id: xcode
        run: |
          # This project sets SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor and a
          # deployment target of 26.2 — both require Xcode 26 (Swift 6.2).
          # GitHub-hosted runners currently ship Xcode 16.x, which cannot
          # compile it (the globals trip "not concurrency-safe" errors and the
          # SDK predates the deployment target). Skip the build there rather
          # than fail forever; it runs for real once runners get Xcode 26.
          # Local verification on Xcode 26.x is the source of truth (CLAUDE.md).
          VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          MAJOR=${VER%%.*}
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "${MAJOR:-0}" -ge 26 ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "Runner Xcode $VER supports this project — building."
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Runner Xcode $VER < 26 cannot build this project (deployment target 26.2 + Swift 6.2 MainActor default isolation). Skipping iOS/macOS build; verified locally on Xcode 26.x."
          fi

      - name: Build macOS
        if: steps.xcode.outputs.supported == 'true'
        run: |
          xcodebuild -project "debt tracker.xcodeproj" \
            -scheme "debt tracker" \
            -destination "platform=macOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build + test iOS Simulator
        if: steps.xcode.outputs.supported == 'true'
        run: |
          # Pick whichever iPhone simulator the runner has installed.
          DEST=$(xcrun simctl list devices available -j | \
            python3 -c "import json,sys; d=json.load(sys.stdin); \
              [print(f\"name={dev['name']}\") for runtime, devs in d['devices'].items() \
              if 'iOS' in runtime for dev in devs if 'iPhone' in dev['name']]" | head -1)
          if [ -z "$DEST" ]; then
            echo "No iOS simulator available on runner — skipping iOS test."
            exit 0
          fi
          NAME=${DEST#name=}
          xcodebuild test -project "debt tracker.xcodeproj" \
            -scheme "debt tracker" \
            -destination "platform=iOS Simulator,name=$NAME" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  android:
    name: Android assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}

      - name: Assemble Debug
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

  supabase:
    name: Supabase Edge Function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Type-check ai-insights
        run: deno check supabase/functions/ai-insights/index.ts
