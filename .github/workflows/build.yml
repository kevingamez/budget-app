name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build macOS
        run: |
          xcodebuild -project "debt tracker.xcodeproj" \
            -scheme "debt tracker" \
            -destination "platform=macOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS Simulator (best effort)
        run: |
          # Pick whichever iPhone simulator the runner has installed.
          DEST=$(xcrun simctl list devices available -j | \
            python3 -c "import json,sys; d=json.load(sys.stdin); \
              [print(f\"name={dev['name']}\") for runtime, devs in d['devices'].items() \
              if 'iOS' in runtime for dev in devs if 'iPhone' in dev['name']]" | head -1)
          if [ -z "$DEST" ]; then
            echo "No iOS simulator available on runner — skipping iOS build."
            exit 0
          fi
          NAME=${DEST#name=}
          xcodebuild -project "debt tracker.xcodeproj" \
            -scheme "debt tracker" \
            -destination "platform=iOS Simulator,name=$NAME" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
